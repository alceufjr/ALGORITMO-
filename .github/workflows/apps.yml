# Compila os apps automaticamente a cada envio (push) ao GitHub.
#  - Android: APK de teste (instale direto no celular) e, se os segredos de
#    assinatura existirem, o .aab assinado para enviar à Google Play.
#  - iOS: compila para o simulador (confere que o projeto está íntegro).
#    O envio assinado à App Store é feito pelo Xcode ou Codemagic (docs/PUBLICACAO.md).
# Baixe os arquivos em: GitHub > Actions > (execução) > Artifacts.
name: Apps

on:
  push:
    paths: ['www/**', 'package.json', 'capacitor.config.json', 'assets/**', 'scripts/**', '.github/workflows/apps.yml']
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Configura AdMob e orientação
        env:
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: bash scripts/configure-native.sh android
      - run: npx cap sync android
      - name: APK de teste
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: AAB assinado (somente se os segredos existirem)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: desata-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - name: Configura AdMob, ATT e orientação
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: bash scripts/configure-native.sh ios
      - run: npx cap sync ios
      - name: Compila para o simulador (sem assinatura)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40

  # Versão de computador (sem anúncios). Roda só quando acionada manualmente:
  # GitHub > Actions > Apps > Run workflow.
  desktop:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desata-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: warn
