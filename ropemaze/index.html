<html>
  <head>
    <meta charset="utf-8" />
    <title>Rope Maze</title>
    <link rel="stylesheet" href="ropemaze.css" type="text/css" />
    <script type="module" src="ropemaze.js"></script>
  </head>
  <body>
    <div id="maze">
      <div id="room_nw">
        <div id="door_nw_n" class="door"></div>
        <div id="door_nw_s" class="door"></div>
        <div id="door_nw_w" class="door"></div>
        <div id="door_nw_e" class="door"></div>
      </div>
      <div id="room_ne">
        <div id="door_ne_n" class="door"></div>
        <div id="door_ne_e" class="door"></div>
        <div id="door_ne_se" class="door"></div>
        <div id="door_ne_sw" class="door"></div>
      </div>
      <div id="room_se">
        <div id="door_se_e" class="door"></div>
        <div id="door_se_s" class="door"></div>
        <div id="door_se_w" class="door"></div>
      </div>
      <div id="room_s">
        <div id="door_s_s" class="door"></div>
      </div>
      <div id="room_sw">
        <div id="door_sw_e" class="door"></div>
        <div id="door_sw_s" class="door"></div>
        <div id="door_sw_w" class="door"></div>
      </div>
      <svg id="rope" width="640" height="480" aria-hidden="true"></svg>
    </div>
    <button id="nextstep">Next Step</button>
    <button id="run">Run</button>
    <button id="stop">Stop</button>
    <div style="clear:left;"></div>
    <div style="float:left;">Count: </div><div id="count">0</div>
    <div style="clear:left;"></div>
    <div style="float:left;">Tries: </div><div id="tries">0</div>
    <div id="status" role="status"></div>
  </body>
</html>
